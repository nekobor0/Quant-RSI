E9: future prospective promotion track, excluded from v0.1 scoring
source_limit: Paper IDs are design priors from docs/inputs/05_SOURCE_INDEX.yaml. Paper
  text and A-share adaptation have not been verified; no exact-paper replication is
  claimed.
execution_status: No hidden cases, data generators, labels, reference outputs or scores
  created.
oracle_pilot_requirements:
  per_template_terminal_outcomes: [valid_positive, justified_refusal, unjustified_refusal, invalid_output, timeout_or_missing]
  denominator_policy: assigned task and oracle evaluability are frozen before candidate output; failed or malformed output never removes a task from an assigned denominator.
  E2_components: [formula_interpretation, PIT_feature_construction, formation, rebalance, benchmark_alignment, execution_assumptions, diagnostic_reasoning]
  E2_transfer_check: one blinded perturbation of release timing, universe membership, or execution lag per selected concept; a copied implementation alone cannot pass.
  always_refuse_baseline: run against every public calibration oracle before pilot acceptance.
  per_template_oracle_manifest: independent custodian must freeze outcome matrix, component weights if any, tolerance, positive/negative controls and invalid handling before access; no numeric component weights frozen in C0.
