eval_result_required:
- condition_hash
- gate_results_with_evidence_refs
- score_vector
- strategy_metrics_separate
- critic_report_ref
- evaluator_version_and_signature
- artifact_hashes
- budget_used
- failure_or_unknown_reasons
- decision
- benchmark_run_id
- scientific_family_id
