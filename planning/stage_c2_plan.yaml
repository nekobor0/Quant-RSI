scope: PUBLIC_SYNTHETIC_CANONICALIZATION_AND_BOUNDED_EMPIRICAL_INPUT_QUALIFICATION
dependencies: 'C2-01 || C2-02; C2-03 empirical portion after C2-02 identifies usable execution-data candidate; C2-04 only after C2-02 and C2-03 demonstrate sufficient sample/data geometry'
